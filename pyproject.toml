[project]
name = "knowledge-injector"
version = "0.1.0"
description = "Knowledge Injection Service for the Tech Lead Joe ecosystem"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "click>=8.1",
    "dependency-injector>=4.41",
    "gitpython>=3.1",
    "hatchling>=1.29.0",
    "httpx>=0.27",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.1",
]

[project.scripts]
knowledge-injector = "knowledge_injector.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/knowledge_injector --cov-report=term-missing"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_injector"]
